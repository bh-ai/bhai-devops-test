name: Sync pipelines to Azure Storage for sparkapplication execution

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'GitHub Environment to use (loads env secrets/vars)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: 'dev'
      source_folder:
        description: 'Source folder path to sync (e.g., ./pipelines or ./pipelines/bh_project_id=299)'
        required: true
        type: string
        default: './pipelines'

env:
  AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME || 'bhdevstoacct01' }}
  AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER || 'bh-airflow' }}
  AZURE_DAG_PREFIX: ${{ vars.AZURE_DAG_PREFIX || 'dags' }}

jobs:
  sync-to-azure:
    name: Sync folder to Azure Storage
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Sync Folder via Azure CLI
        env:
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          if [ -z "$AZURE_STORAGE_ACCOUNT_KEY" ]; then
            echo "Error: AZURE_STORAGE_ACCOUNT_KEY secret is not set in the environment or repository."
            exit 1
          fi
          
          if [ -z "${{ env.AZURE_STORAGE_ACCOUNT_NAME }}" ] || [ -z "${{ env.AZURE_STORAGE_CONTAINER }}" ]; then
            echo "Error: AZURE_STORAGE_ACCOUNT_NAME and AZURE_STORAGE_CONTAINER must be set in env or vars."
            exit 1
          fi

          SOURCE="${{ github.event.inputs.source_folder }}"
          ACCOUNT="${{ env.AZURE_STORAGE_ACCOUNT_NAME }}"
          CONTAINER="${{ env.AZURE_STORAGE_CONTAINER }}"
          DAG_PREFIX="${{ env.AZURE_DAG_PREFIX }}"
          
          # Clean up source to be used as destination path (remove leading ./ and /)
          CLEAN_SOURCE=$(echo "$SOURCE" | sed -e 's/^\.\///' -e 's/^\///')
          
          if [ -n "$DAG_PREFIX" ]; then
             DAG_PREFIX=$(echo "$DAG_PREFIX" | sed -e 's/\/$//')
             DEST_PATH="$DAG_PREFIX/$CLEAN_SOURCE"
          else
             DEST_PATH="$CLEAN_SOURCE"
          fi
          
          echo "Syncing contents of '$SOURCE' to container '$CONTAINER' under the path '$DEST_PATH' in account '$ACCOUNT'..."
          
          az storage blob sync \
            --account-name "$ACCOUNT" \
            --account-key "$AZURE_STORAGE_ACCOUNT_KEY" \
            --container "$CONTAINER" \
            --source "$SOURCE" \
            --destination "$DEST_PATH"
          
          echo "Sync completed successfully."
